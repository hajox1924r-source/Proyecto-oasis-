spring.application.name=farmacia-oasis

# Conexión a MySQL. La base de datos se crea con el script bd/farmacia_oasis.sql
spring.datasource.url=jdbc:mysql://localhost:3306/farmacia_oasis
spring.datasource.username=root
spring.datasource.password=

# Las tablas las crea el script SQL, no Hibernate
spring.jpa.hibernate.ddl-auto=none

# Si tu MySQL usa otro usuario o clave, ponlos en un archivo application-local.properties
# en la raíz del proyecto (ese archivo no se sube al repositorio). Ver README.
spring.config.import=optional:file:./application-local.properties
