<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Iniciar sesión')}"></head>
<body class="pagina-login">

<main class="tarjeta login">
    <h1>Farmacia Oasis</h1>

    <p class="aviso error" th:if="${param.error}">Correo o contraseña incorrectos.</p>
    <p class="aviso" th:if="${param.logout}">Cerraste la sesión.</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Correo</label>
        <input type="email" id="username" name="username" required autofocus>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Ingresar</button>
    </form>
</main>

</body>
</html>
