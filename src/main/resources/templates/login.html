<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head-general}">
    <title>Iniciar sesión - Farmacia Oasis</title>
</head>
<body class="pagina-login">

<main class="login-card">
    <h1>Farmacia Oasis</h1>

    <!-- Mensajes de estado de autenticación (Spring Security) -->
    <div class="alerta-error" th:if="${param.error}">
        Usuario o contraseña incorrectos. Por favor, intenta de nuevo.
    </div>

    <div class="alerta-exito" th:if="${param.logout}">
        Has cerrado sesión exitosamente.
    </div>

    <!-- Formulario de autenticación -->
    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Usuario o correo</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-primario">Iniciar sesión</button>
    </form>
</main>

</body>
</html>
