<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos :: head-general}">
    <title>Lotes - Farmacia Oasis</title>
</head>
<body>

    <!-- Fragmento: Sidebar -->
    <aside th:replace="~{fragmentos :: sidebar}"></aside>

    <!-- Contenido principal -->
    <main>
        <!-- Mensajes flash -->
        <div th:replace="~{fragmentos :: mensajes-flash}"></div>

        <!-- Barra superior -->
        <section class="barra-superior">
            <h1>Gestión de Entradas de Mercancía y Lotes</h1>
        </section>

        <!-- Formulario de registro de lote -->
        <section class="bloque-registro">
            <h2>Registrar entrada de lote</h2>
            <form method="post"
                  th:action="@{/lotes/guardar}"
                  th:object="${nuevoLote}"
                  class="form-oasis">
                <div class="form-group">
                    <label for="producto">Producto</label>
                    <select id="producto" th:field="*{producto}" class="form-control" required>
                        <option value="">Seleccione un producto...</option>
                        <option th:each="prod : ${listaProductos}"
                                th:value="${prod.id}"
                                th:text="${prod.nombre}">Acetaminofén</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="proveedor">Proveedor</label>
                    <select id="proveedor" th:field="*{proveedor}" class="form-control" required>
                        <option value="">Seleccione un proveedor...</option>
                        <option th:each="prov : ${listaProveedores}"
                                th:value="${prov.id}"
                                th:text="${prov.nombre}">Distribuidora Oasis</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="codigoLote">Código de Lote</label>
                    <input type="text"
                           id="codigoLote"
                           th:field="*{codigoLote}"
                           class="form-control"
                           placeholder="Ej. LOT-2026-001"
                           required>
                </div>

                <div class="form-group">
                    <label for="cantidad">Cantidad recibida</label>
                    <input type="number"
                           id="cantidad"
                           th:field="*{cantidad}"
                           class="form-control"
                           min="1"
                           placeholder="1"
                           required>
                </div>

                <div class="form-group">
                    <label for="fechaVencimiento">Fecha de Vencimiento</label>
                    <input type="date"
                           id="fechaVencimiento"
                           th:field="*{fechaVencimiento}"
                           class="form-control"
                           required>
                </div>

                <div class="form-acciones">
                    <button type="submit" class="btn-primario">Registrar lote</button>
                    <button type="reset" class="btn-secundario">Limpiar</button>
                </div>
            </form>
        </section>

        <!-- Historial de lotes -->
        <section class="contenido-tabla">
            <h2>Historial de lotes</h2>
            <table class="tabla-oasis">
                <thead>
                    <tr>
                        <th>Código Lote</th>
                        <th>Producto</th>
                        <th>Proveedor</th>
                        <th class="numero">Cantidad</th>
                        <th>Fecha Vencimiento</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="lote : ${lotes}">
                        <td th:text="${lote.codigoLote}">A-1001</td>
                        <td th:text="${lote.producto != null} ? ${lote.producto.nombre} : 'Sin producto'">Acetaminofén</td>
                        <td th:text="${lote.proveedor != null} ? ${lote.proveedor.nombre} : 'Sin proveedor'">Proveedor</td>
                        <td class="numero" th:text="${lote.cantidad}">40</td>
                        <td th:text="${lote.fechaVencimiento != null} ? ${#temporals.format(lote.fechaVencimiento, 'dd/MM/yyyy')} : '-'">01/01/2027</td>
                        <td>
                            <span class="estado"
                                  th:classappend="${lote.estado == 'VENCIDO' ? 'vencido' : (lote.estado == 'VIGENTE' ? 'vigente' : 'proximo')}"
                                  th:text="${lote.estado}">VIGENTE</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(lotes)}">
                        <td colspan="6">
                            <p class="tabla-vacia">
                                No hay lotes registrados para mostrar.
                            </p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Fragmento: Footer -->
    <footer th:replace="~{fragmentos :: footer}"></footer>

</body>
</html>
