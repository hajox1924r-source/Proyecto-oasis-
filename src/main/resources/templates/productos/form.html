<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head-general}">
    <title>Editar producto - Farmacia Oasis</title>
</head>
<body>

    <!-- Fragmento: Sidebar -->
    <aside th:replace="~{fragmentos :: sidebar}"></aside>

    <!-- Contenido principal -->
    <main>
        <section class="barra-superior">
            <h1>Editar producto</h1>
            <a th:href="@{/productos}" class="btn-secundario">Volver al listado</a>
        </section>

        <!-- Mensajes flash -->
        <div th:replace="~{fragmentos :: mensajes-flash}"></div>

        <section class="bloque-registro">
            <form method="post" th:action="@{/productos/guardar}" class="form-oasis">
                <input type="hidden" name="idProducto" th:value="${producto.idProducto}">

                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo" name="codigo" class="form-control"
                           th:value="${producto.codigo}" required>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre del medicamento</label>
                    <input type="text" id="nombre" name="nombre" class="form-control"
                           th:value="${producto.nombre}" required>
                </div>

                <div class="form-group">
                    <label for="presentacion">Presentación / Concentración</label>
                    <input type="text" id="presentacion" name="presentacion" class="form-control"
                           th:value="${producto.presentacion}">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" class="form-control" required>
                        <option value="">Seleccione una categoría...</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.idCategoria}"
                                th:text="${cat.nombre}"
                                th:selected="${producto.categoria != null and producto.categoria.idCategoria == cat.idCategoria}">Analgésicos</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="precioVenta">Precio de venta</label>
                    <input type="number" id="precioVenta" name="precioVenta" step="0.01" min="0"
                           class="form-control" th:value="${producto.precioVenta}" required>
                </div>

                <div class="form-acciones">
                    <button type="submit" class="btn-primario">Guardar cambios</button>
                    <a th:href="@{/productos}" class="btn-secundario">Cancelar</a>
                </div>
            </form>
        </section>
    </main>

    <!-- Fragmento: Footer -->
    <footer th:replace="~{fragmentos :: footer}"></footer>

</body>
</html>
